# Operator must replace image, endpoint, config and service account before applying.
# Existing KSA must have Workload Identity and monitoring read permission.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autopilot-telemetry
  namespace: inference
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 480
      template:
        spec:
          serviceAccountName: autopilot-monitoring-reader
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: exporter
              image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT/YOUR_REPOSITORY/autopilot-telemetry:YOUR_TAG
              args: ["--config", "/config/model-map.json", "--window-minutes", "5"]
              env:
                - name: AUTOPILOT_INGEST_URL
                  value: https://YOUR_AUTOPILOT_HOST/api/telemetry/ingest
                - name: AUTOPILOT_INGEST_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: autopilot-telemetry-ingest
                      key: token
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: autopilot-telemetry-model-map
